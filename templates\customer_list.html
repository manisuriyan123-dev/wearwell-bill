<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer List - Wear Well</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo-container">
                <svg class="cart-icon" viewBox="0 0 24 24" fill="white">
                    <path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.15.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12L8.1 13h7.45c.75 0 1.41-.41 1.75-1.03L21.7 4H5.21l-.94-2H1zm16 16c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
                <div style="display:flex;flex-direction:column;line-height:1;">
                    <span class="logo-text">Wear Well</span>
                    <span class="instagram-handle">@wear_well_123</span>
                </div>
            </div>
        </div>
        <div class="header-right">
            <div style="font-size:16px; color: white;">
                <a href="/" style="color: white; text-decoration: underline;">Back to POS</a>
            </div>
        </div>
    </header>

    <main style="padding: 20px;">
        <h2 style="color:#1e3a8a; margin-bottom: 15px;">Customer Information List</h2>
        <div style="margin-bottom:10px;">
            <input type="text" id="search-customers" placeholder="Search customers..." style="padding:8px; width:300px; border:1px solid #cbd5e1; border-radius:4px;">
            <button id="search-btn" class="btn btn-primary" style="margin-left:10px;">Search</button>
            <button class="btn btn-success" onclick="window.location='/?add_customer'" style="margin-left:10px;">Add New Customer</button>
        </div>
        <div id="customer-list">Loading...</div>
    </main>

    <script src="/static/js/api.js"></script>
    <script>
        async function renderCustomerList(search = '') {
            const div = document.getElementById('customer-list');
            try {
                const customers = await API.getCustomers({ search });
                if (!customers || customers.length === 0) {
                    div.innerHTML = '<p>No customers found.</p>';
                    return;
                }

                div.innerHTML = `
                    <table style="width:100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background:#f1f5f9;">
                                <th style="padding:10px; text-align:left">Name</th>
                                <th style="padding:10px; text-align:left">Phone</th>
                                <th style="padding:10px; text-align:left">Loyalty Card</th>
                                <th style="padding:10px; text-align:left">Email</th>
                                <th style="padding:10px; text-align:left">Address</th>
                                <th style="padding:10px; text-align:center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${customers.map(c => `
                                <tr style="border-bottom:1px solid #e2e8f0;">
                                    <td style="padding:10px">${c.name}</td>
                                    <td style="padding:10px">${c.phone || ''}</td>
                                    <td style="padding:10px">${c.loyalty_card || ''}</td>
                                    <td style="padding:10px">${c.email || ''}</td>
                                    <td style="padding:10px">${c.address || ''}</td>
                                    <td style="padding:10px; text-align:center">
                                        <button class="btn btn-primary" onclick="editCustomer(${c.id})">Edit</button>
                                        <button class="btn btn-danger" onclick="deleteCustomer(${c.id})">Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                console.error('Error loading customers:', err);
                div.innerHTML = '<p style="color:red">Error loading customers: ' + err.message + '</p>';
            }
        }

        function deleteCustomer(id) {
            if (!confirm('Are you sure you want to delete this customer? This action cannot be undone.')) {
                return;
            }
            
            // Show loading state
            const deleteBtn = event.target;
            const originalText = deleteBtn.textContent;
            deleteBtn.textContent = 'Deleting...';
            deleteBtn.disabled = true;
            
            API.deleteCustomer(id)
                .then(() => {
                    alert('Customer deleted successfully!');
                    // Refresh the customer list
                    renderCustomerList();
                })
                .catch(error => {
                    console.error('Error deleting customer:', error);
                    alert('Error deleting customer: ' + error.message);
                })
                .finally(() => {
                    // Reset button state
                    deleteBtn.textContent = originalText;
                    deleteBtn.disabled = false;
                });
        }

        async function editCustomer(id) {
            try {
                const customer = await API.getCustomer(id);
                document.getElementById('edit-customer-name').value = customer.name || '';
                document.getElementById('edit-customer-phone').value = customer.phone || '';
                document.getElementById('edit-customer-email').value = customer.email || '';
                document.getElementById('edit-customer-loyalty').value = customer.loyalty_card || '';
                document.getElementById('edit-customer-address').value = customer.address || '';
                document.getElementById('edit-customer-message').textContent = '';
                document.getElementById('edit-customer-message').className = '';
                // Store the customer id for update
                document.getElementById('update-customer-btn').dataset.customerId = id;
                // Clear any previous message
                document.getElementById('edit-customer-message').textContent = '';
                document.getElementById('edit-customer-message').className = '';
                document.getElementById('edit-customer-modal').style.display = 'block';
            } catch (error) {
                alert('Error loading customer: ' + error.message);
            }
        }

        document.getElementById('search-btn').addEventListener('click', () => {
            const search = document.getElementById('search-customers').value.trim();
            renderCustomerList(search);
        });

        document.getElementById('search-customers').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const search = e.target.value.trim();
                renderCustomerList(search);
            }
        });

        // Update Customer Handler (named function so it's available after page load)
        async function handleUpdateCustomer() {
            const id = parseInt(document.getElementById('update-customer-btn').dataset.customerId);
            const name = document.getElementById('edit-customer-name').value.trim();
            const phone = document.getElementById('edit-customer-phone').value.trim();
            const email = document.getElementById('edit-customer-email').value.trim();
            const loyalty = document.getElementById('edit-customer-loyalty').value.trim();
            const address = document.getElementById('edit-customer-address').value.trim();
            const messageDiv = document.getElementById('edit-customer-message');
            
            console.log('Update handler called. ID:', id);
            
            if (!id || isNaN(id)) {
                messageDiv.className = 'error';
                messageDiv.textContent = 'Customer ID not found. Please try again.';
                console.error('Invalid customer ID:', id);
                return;
            }
            
            if (!name) {
                messageDiv.className = 'error';
                messageDiv.textContent = 'Customer name is required';
                return;
            }
            
            try {
                const customerData = {
                    name,
                    phone: phone || null,
                    email: email || null,
                    loyalty_card: loyalty || null,
                    address: address || null
                };
                
                console.log('Updating customer:', {id, customerData});
                const result = await API.updateCustomer(id, customerData);
                console.log('Update successful:', result);
                
                messageDiv.className = 'success';
                messageDiv.textContent = 'Customer updated successfully!';
                // Refresh the list
                setTimeout(() => {
                    renderCustomerList();
                }, 300);
                // Close modal after a delay
                setTimeout(() => {
                    document.getElementById('edit-customer-modal').style.display = 'none';
                }, 1500);
            } catch (error) {
                console.error('Error updating customer:', error);
                messageDiv.className = 'error';
                messageDiv.textContent = error.message || 'Error updating customer';
            }
        }

        // Initial render (after page load)
        setTimeout(() => {
            renderCustomerList();
            // Reattach update button listener after DOM is ready
            const updateBtn = document.getElementById('update-customer-btn');
            if (updateBtn && !updateBtn._listenerAttached) {
                updateBtn.addEventListener('click', handleUpdateCustomer);
                updateBtn._listenerAttached = true;
            }
        }, 0);
    </script>

    <!-- Edit Customer Modal -->
    <div id="edit-customer-modal" class="modal">
        <div class="modal-content" style="max-width: 600px; max-height: 80vh; overflow-y: auto;">
            <span class="close" onclick="document.getElementById('edit-customer-modal').style.display='none'">&times;</span>
            <h2>Edit Customer</h2>
            <table style="width:100%; border-collapse: collapse; margin-bottom:10px;">
                <tbody>
                    <tr>
                        <td style="padding:10px; font-weight:bold;">Name: <span style="color: red;">*</span></td>
                        <td style="padding:10px;"><input type="text" id="edit-customer-name" class="form-input" placeholder="Enter customer name" required style="width:100%;"></td>
                    </tr>
                    <tr>
                        <td style="padding:10px; font-weight:bold;">Phone:</td>
                        <td style="padding:10px;"><input type="text" id="edit-customer-phone" class="form-input" placeholder="Enter phone number" style="width:100%;"></td>
                    </tr>
                    <tr>
                        <td style="padding:10px; font-weight:bold;">Email:</td>
                        <td style="padding:10px;"><input type="email" id="edit-customer-email" class="form-input" placeholder="Enter email" style="width:100%;"></td>
                    </tr>
                    <tr>
                        <td style="padding:10px; font-weight:bold;">Loyalty Card:</td>
                        <td style="padding:10px;"><input type="text" id="edit-customer-loyalty" class="form-input" placeholder="Enter loyalty card number" style="width:100%;"></td>
                    </tr>
                    <tr>
                        <td style="padding:10px; font-weight:bold;">Address:</td>
                        <td style="padding:10px;"><textarea id="edit-customer-address" class="form-input" rows="3" placeholder="Enter address" style="width:100%;"></textarea></td>
                    </tr>
                </tbody>
            </table>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-primary" style="flex: 1;" id="update-customer-btn">Update</button>
                <button class="btn btn-secondary" style="flex: 1;" onclick="document.getElementById('edit-customer-modal').style.display='none'">Cancel</button>
            </div>
            <div id="edit-customer-message" style="margin-top: 10px;"></div>
        </div>
    </div>

</body>
</html>
