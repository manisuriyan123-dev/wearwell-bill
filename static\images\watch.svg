<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80">
  <!-- Watch Band (Top) -->
  <rect x="42" y="5" width="16" height="15" fill="#8b7355" rx="3"/>
  
  <!-- Watch Case -->
  <circle cx="50" cy="50" r="28" fill="#e8d4b8" stroke="#8b7355" stroke-width="1.5"/>
  
  <!-- Watch Face -->
  <circle cx="50" cy="50" r="24" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  
  <!-- Glass Cover -->
  <circle cx="50" cy="50" r="22" fill="none" stroke="#ccc" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Hour Markers -->
  <g stroke="#333" stroke-width="1">
    <line x1="50" y1="30" x2="50" y2="28"/>
    <line x1="70" y1="50" x2="72" y2="50"/>
    <line x1="50" y1="70" x2="50" y2="72"/>
    <line x1="30" y1="50" x2="28" y2="50"/>
  </g>
  
  <!-- Hour Hand -->
  <line x1="50" y1="50" x2="50" y2="40" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Minute Hand -->
  <line x1="50" y1="50" x2="50" y2="32" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Center Dot -->
  <circle cx="50" cy="50" r="2" fill="#333"/>
  
  <!-- Watch Band (Bottom) -->
  <rect x="42" y="80" width="16" height="15" fill="#8b7355" rx="3"/>
</svg>