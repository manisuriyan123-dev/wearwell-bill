<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80">
  <!-- Chain Links -->
  <!-- Top segment -->
  <g>
    <!-- Link 1 -->
    <ellipse cx="30" cy="20" rx="6" ry="10" fill="none" stroke="#d4af37" stroke-width="2"/>
    <!-- Link 2 -->
    <ellipse cx="50" cy="20" rx="6" ry="10" fill="none" stroke="#d4af37" stroke-width="2"/>
    <!-- Link 3 -->
    <ellipse cx="70" cy="20" rx="6" ry="10" fill="none" stroke="#d4af37" stroke-width="2"/>
  </g>
  
  <!-- Middle curved segment -->
  <path d="M 24 30 Q 20 45 25 55" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  <path d="M 50 30 L 50 55" fill="none" stroke="#d4af37" stroke-width="2"/>
  <path d="M 76 30 Q 80 45 75 55" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Pendant/Stone -->
  <circle cx="50" cy="75" r="10" fill="#e74c3c"/>
  <ellipse cx="50" cy="72" rx="3" ry="4" fill="white" opacity="0.8"/>
  
  <!-- Connection lines -->
  <line x1="25" y1="55" x2="50" y2="65" stroke="#d4af37" stroke-width="2"/>
  <line x1="75" y1="55" x2="50" y2="65" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Shine effect on links -->
  <circle cx="30" cy="17" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="50" cy="17" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="70" cy="17" r="1.5" fill="white" opacity="0.6"/>
</svg>